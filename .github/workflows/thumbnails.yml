# Screenshots project homepages and commits them to thumbs/.
# - When projects.json changes: only projects without a thumbnail.
# - Every Monday, or when run by hand from the Actions tab: every project,
#   so thumbnails follow site redesigns.
name: Refresh thumbnails

on:
  push:
    branches: [main]
    paths: [projects.json]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - name: Take screenshots
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run shoot
          else
            npm run shoot:all
          fi

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add thumbs projects.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update thumbnails"
            git push
          fi
